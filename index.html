<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime MAD - مدونة الأنمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: white; }
        .anime-card:hover { transform: scale(1.05); transition: 0.3s; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 50; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
    </style>
</head>
<body>
    <nav class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900">
        <h1 class="text-2xl font-bold text-blue-500">Anime MAD</h1>
        <div class="space-x-4 space-x-reverse">
            <a href="#" class="hover:text-blue-400">الرئيسية</a>
            <a href="#" class="hover:text-blue-400">قائمة الأنمي</a>
        </div>
    </nav>

    <main class="p-8">
        <h2 class="text-3xl font-bold mb-8 text-center">مشاهدة ون بيس - الحلقة 1</h2>
        
        <div class="max-w-4xl mx-auto bg-slate-800 rounded-xl overflow-hidden shadow-2xl">
            <!-- مشغل الفيديو -->
            <div class="relative pt-[56.25%]">
                <iframe 
                    id="videoPlayer"
                    class="absolute inset-0 w-full h-full"
                    src="https://www.dailymotion.com/embed/video/x9y5r2e" 
                    frameborder="0" 
                    allowfullscreen 
                    allow="autoplay">
                </iframe>
            </div>
            <div class="p-6">
                <h3 class="text-xl font-bold mb-2">ون بيس (One Piece) - الحلقة 1</h3>
                <p class="text-slate-400">استمتع بمشاهدة الحلقة الأولى من مغامرة لوفي في عالم القراصنة باللغة العربية.</p>
            </div>
        </div>

        <div class="mt-12 grid grid-cols-1 md:grid-cols-3 gap-6 max-w-6xl mx-auto">
            <!-- بطاقات أنمي أخرى كمثال -->
            <div class="anime-card bg-slate-800 rounded-lg overflow-hidden cursor-pointer">
                <img src="https://image.tmdb.org/t/p/w500/867Z9ZpYpS9pS9pS9pS9pS9pS9p.jpg" alt="One Piece" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h4 class="font-bold">ون بيس - الحلقة 2</h4>
                    <p class="text-sm text-slate-400">قريباً...</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-8 text-center border-t border-slate-800 text-slate-500">
        &copy; 2026 Anime MAD - جميع الحقوق محفوظة
    </footer>
</body>
</html>
