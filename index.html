<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OtakuHub - منصة الأنمي الاحترافية">
    <meta name="theme-color" content="#0b0f1a">
    <title>OtakuHub - منصة الأنمي الاحترافية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/logo-otakuhub.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Cairo', 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #0b0f1a 0%, #1a1f2e 100%);
            color: #e2e8f0; 
            min-height: 100vh;
        }
        .glass { 
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .anime-card {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border-radius: 1rem;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .anime-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: #3b82f6;
            box-shadow: 0 20px 40px rgba(59, 130, 246, 0.3);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
        }
        .modal-content {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 1.5rem;
            max-width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(59, 130, 246, 0.3);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal.active .modal-content {
            transform: scale(1);
        }
        .player-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 1rem;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .episode-item {
            transition: all 0.3s ease;
            border-radius: 0.75rem;
            border: 1px solid rgba(59, 130, 246, 0.2);
            background: rgba(30, 41, 59, 0.4);
        }
        .episode-item:hover {
            background-color: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            transform: translateX(-5px);
        }
        .nav-link {
            cursor: pointer;
            transition: color 0.3s;
        }
        .nav-link:hover {
            color: #3b82f6;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar sticky top-0 z-50 glass p-4 md:p-6 flex justify-between items-center px-4 md:px-8 border-b border-slate-700">
        <div class="flex items-center gap-4 md:gap-8">
            <div class="flex items-center gap-2 md:gap-3">
                <img src="assets/logo-otakuhub.png" alt="OtakuHub" class="h-10 w-10 md:h-12 md:w-12 object-contain">
                <h1 class="text-xl md:text-3xl font-extrabold gradient-text">Otaku<span class="text-white">Hub</span></h1>
            </div>
            <div class="hidden lg:flex gap-4 md:gap-6">
                <span onclick="location.href='#home'" class="nav-link">الرئيسية</span>
                <span onclick="location.href='#one-piece'" class="nav-link">ون بيس</span>
                <span onclick="location.href='#popular'" class="nav-link">الشهيرة</span>
            </div>
        </div>
        
        <div class="flex items-center gap-2 md:gap-4">
            <div class="relative">
                <button class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 transition flex items-center gap-2 px-4" onclick="toggleUserMenu()">
                    <i class="fas fa-user text-blue-400"></i>
                    <span class="hidden md:inline text-sm font-bold">الحساب</span>
                </button>
                <div id="userMenu" class="hidden absolute top-12 right-0 glass rounded-lg p-2 min-w-[180px] shadow-2xl border border-slate-700 z-[1001]">
                    <button onclick="openModal('loginModal')" class="w-full text-right py-2 px-4 hover:bg-blue-500/20 rounded transition flex items-center gap-2">
                        <i class="fas fa-sign-in-alt text-blue-400"></i> تسجيل الدخول
                    </button>
                    <button onclick="openModal('registerModal')" class="w-full text-right py-2 px-4 hover:bg-blue-500/20 rounded transition flex items-center gap-2">
                        <i class="fas fa-user-plus text-green-400"></i> إنشاء حساب
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main id="home" class="p-4 md:p-8 max-w-7xl mx-auto">
        <!-- Hero Section -->
        <section class="mb-12">
            <div class="relative rounded-2xl overflow-hidden shadow-2xl mb-8" style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">
                <div class="relative p-8 md:p-12 text-center z-10">
                    <img src="assets/logo-otakuhub.png" alt="Logo" class="h-20 w-20 md:h-24 md:w-24 mx-auto mb-4 object-contain">
                    <h2 class="text-3xl md:text-4xl font-bold text-white mb-2">OtakuHub</h2>
                    <p class="text-lg md:text-xl text-blue-200">منصة تفاعلية احترافية لمشاهدة أفضل الأنميات</p>
                </div>
            </div>
        </section>

        <!-- Quick Access Icons -->
        <section class="mb-12">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-1 h-8 bg-gradient-to-b from-yellow-500 to-orange-500 rounded"></div>
                <h2 class="text-2xl md:text-3xl font-bold">وصول سريع للحلقات</h2>
            </div>
            <div class="flex flex-wrap gap-6 justify-center md:justify-start">
                <div onclick="openAnimeModal('One Piece')" class="group cursor-pointer text-center">
                    <div class="w-20 h-20 md:w-24 md:h-24 rounded-full overflow-hidden border-4 border-blue-500 shadow-lg group-hover:scale-110 transition-transform duration-300">
                        <img src="assets/one-piece.jpg" alt="One Piece" class="w-full h-full object-cover">
                    </div>
                    <p class="mt-2 font-bold text-sm md:text-base group-hover:text-blue-400 transition">ون بيس</p>
                </div>
                <div onclick="openAnimeModal('Death Note')" class="group cursor-pointer text-center">
                    <div class="w-20 h-20 md:w-24 md:h-24 rounded-full overflow-hidden border-4 border-red-500 shadow-lg group-hover:scale-110 transition-transform duration-300">
                        <img src="assets/death-note.jpg" alt="Death Note" class="w-full h-full object-cover">
                    </div>
                    <p class="mt-2 font-bold text-sm md:text-base group-hover:text-red-400 transition">مذكرة الموت</p>
                </div>
            </div>
        </section>

        <!-- One Piece Section -->
        <section id="one-piece" class="mb-12">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-1 h-8 bg-gradient-to-b from-blue-500 to-purple-500 rounded"></div>
                <h2 class="text-2xl md:text-3xl font-bold">ون بيس - One Piece</h2>
            </div>
            <div class="glass p-4 md:p-6 rounded-2xl">
                <h3 class="text-lg md:text-xl font-bold mb-4">أحدث الحلقات</h3>
                <div id="onePieceEpisodes" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
            </div>
        </section>
    </main>

    <!-- Modals -->
    <div id="animeModal" class="modal">
        <div class="modal-content p-4 md:p-8 w-full md:w-4/5 lg:w-2/3">
            <div class="flex justify-between items-center mb-6">
                <h2 id="modalAnimeTitle" class="text-2xl md:text-3xl font-bold gradient-text"></h2>
                <button onclick="closeModal('animeModal')" class="text-2xl hover:text-red-500 transition"><i class="fas fa-times"></i></button>
            </div>
            <div id="modalEpisodesList" class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[60vh] overflow-y-auto p-2"></div>
        </div>
    </div>

    <div id="playerModal" class="modal">
        <div class="modal-content p-4 md:p-8 w-full md:w-4/5 lg:w-3/4">
            <div class="flex justify-between items-center mb-4">
                <h2 id="episodeTitle" class="text-xl md:text-2xl font-bold"></h2>
                <button onclick="closeModal('playerModal')" class="text-2xl hover:text-red-500 transition"><i class="fas fa-times"></i></button>
            </div>
            <div class="player-container">
                <!-- Sandbox attribute is key to blocking popups -->
                <iframe id="videoPlayer" src="" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content p-6 md:p-8 w-full md:w-96">
            <h2 class="text-2xl font-bold mb-6 text-center">تسجيل الدخول</h2>
            <form onsubmit="event.preventDefault(); alert('تم تسجيل الدخول بنجاح'); closeModal('loginModal');">
                <div class="mb-4">
                    <label class="block text-sm font-bold mb-2">البريد الإلكتروني</label>
                    <input type="email" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-bold mb-2">كلمة المرور</label>
                    <input type="password" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 focus:outline-none focus:border-blue-500" required>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 rounded-lg py-3 font-bold transition">دخول</button>
            </form>
            <button onclick="closeModal('loginModal')" class="w-full mt-4 py-2 text-slate-400 hover:text-white transition">إلغاء</button>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content p-6 md:p-8 w-full md:w-96">
            <h2 class="text-2xl font-bold mb-6 text-center">إنشاء حساب جديد</h2>
            <form onsubmit="event.preventDefault(); alert('تم إنشاء الحساب بنجاح'); closeModal('registerModal');">
                <div class="mb-4">
                    <label class="block text-sm font-bold mb-2">الاسم الكامل</label>
                    <input type="text" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-bold mb-2">البريد الإلكتروني</label>
                    <input type="email" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 focus:outline-none focus:border-blue-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-bold mb-2">كلمة المرور</label>
                    <input type="password" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 focus:outline-none focus:border-blue-500" required>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-green-600 to-blue-600 hover:from-green-700 hover:to-blue-700 rounded-lg py-3 font-bold transition">إنشاء حساب</button>
            </form>
            <button onclick="closeModal('registerModal')" class="w-full mt-4 py-2 text-slate-400 hover:text-white transition">إلغاء</button>
        </div>
    </div>

    <script src="assets/app.js"></script>
</body>
</html>
